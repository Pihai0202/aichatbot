<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeroAI Desk - 極輕量多模型 AI 桌面工作站</title>
  <link rel="stylesheet" href="./src/css/style.css">
</head>
<body>
  <div id="app-container">
    
    <!-- Left Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-icon" id="brand-icon-slot"></div>
          <span>ZeroAI Desk</span>
        </div>
        <button id="btn-toggle-sidebar" class="icon-btn" title="收合側邊欄">
          <span class="icon-slot" data-icon="sidebar"></span>
        </button>
      </div>

      <button id="btn-new-chat" class="new-chat-btn">
        <span class="icon-slot" data-icon="plus"></span>
        <span>開啟新對話</span>
      </button>

      <div id="chat-history-list" class="chat-history">
        <!-- History items dynamically rendered -->
      </div>

      <div class="sidebar-footer">
        <div id="ollama-status-badge" class="ollama-status-badge" title="點擊檢視/重連 Ollama 本地服務">
          <div id="ollama-status-dot" class="status-dot checking"></div>
          <span id="ollama-status-text">Ollama 探測中...</span>
        </div>
        <button id="btn-open-settings" class="icon-btn" title="遠端 API 設定">
          <span class="icon-slot" data-icon="settings"></span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      
      <!-- Top Navbar -->
      <header class="top-navbar">
        <div class="nav-left">
          <button id="btn-expand-sidebar" class="icon-btn" style="display: none;" title="展開側邊欄">
            <span class="icon-slot" data-icon="sidebar"></span>
          </button>
          
          <!-- Custom High-End Model Selector Dropdown -->
          <div id="custom-model-dropdown" class="custom-dropdown">
            <button id="model-dropdown-trigger" class="dropdown-trigger">
              <span class="icon-slot" data-icon="brain" style="color: var(--primary);"></span>
              <span id="selected-model-text" class="selected-model-text">載入模型列表中...</span>
              <span class="icon-slot" data-icon="chevronDown"></span>
            </button>
            
            <div id="model-dropdown-menu" class="dropdown-menu">
              <!-- Dynamically populated custom items -->
            </div>
          </div>
        </div>

        <div class="nav-right">
          <button id="btn-export-chat" class="icon-btn" title="匯出對話紀錄">
            <span class="icon-slot" data-icon="export"></span>
          </button>
          <button id="btn-toggle-tuning" class="icon-btn" title="AI 微調參數與 System Prompt">
            <span class="icon-slot" data-icon="sliders"></span>
          </button>
        </div>
      </header>

      <!-- Chat Messages Container -->
      <div id="messages-container" class="messages-container">
        <!-- Welcome banner or messages will be rendered here -->
      </div>

      <!-- Bottom Chat Input -->
      <div class="input-area-container">
        <div class="input-box-wrapper">
          <textarea id="chat-input" class="chat-input" placeholder="輸入訊息... (Shift + Enter 換行，Enter 送出)" rows="1"></textarea>
          <div class="input-actions">
            <span class="input-hints">極低資源模式 · 本地/遠端雙引擎</span>
            <button id="btn-send" class="send-btn" title="送出">
              <span class="icon-slot" data-icon="send"></span>
            </button>
          </div>
        </div>
      </div>

      <!-- Fine-Tuning Drawer (Right Sidebar) -->
      <aside id="tuning-drawer" class="tuning-drawer">
        <div class="drawer-header">
          <div class="drawer-title">
            <span class="icon-slot" data-icon="sliders" style="color: var(--primary);"></span>
            <span>AI 參數微調</span>
          </div>
          <button id="btn-close-tuning" class="icon-btn">
            <span class="icon-slot" data-icon="close"></span>
          </button>
        </div>

        <!-- Temperature -->
        <div class="param-group">
          <div class="param-label">
            <span>溫度 (Temperature)</span>
            <span id="val-temperature" class="param-value">0.7</span>
          </div>
          <input type="range" id="slider-temperature" class="param-slider" min="0" max="2" step="0.1" value="0.7">
          <div class="preset-pills">
            <button class="preset-pill" onclick="setParamPreset('temperature', 0.2)">精確 (0.2)</button>
            <button class="preset-pill active" onclick="setParamPreset('temperature', 0.7)">平衡 (0.7)</button>
            <button class="preset-pill" onclick="setParamPreset('temperature', 1.2)">創意 (1.2)</button>
          </div>
        </div>

        <!-- Top P -->
        <div class="param-group">
          <div class="param-label">
            <span>Top P (核採樣)</span>
            <span id="val-topp" class="param-value">0.9</span>
          </div>
          <input type="range" id="slider-topp" class="param-slider" min="0" max="1" step="0.05" value="0.9">
        </div>

        <!-- Max Tokens / Context Length -->
        <div class="param-group">
          <div class="param-label">
            <span>最大 Token 長度</span>
            <span id="val-maxtokens" class="param-value">4096</span>
          </div>
          <input type="range" id="slider-maxtokens" class="param-slider" min="256" max="16384" step="256" value="4096">
        </div>

        <!-- Repeat Penalty -->
        <div class="param-group">
          <div class="param-label">
            <span>重複懲罰 (Repeat Penalty)</span>
            <span id="val-repeatpenalty" class="param-value">1.1</span>
          </div>
          <input type="range" id="slider-repeatpenalty" class="param-slider" min="0.8" max="2.0" step="0.05" value="1.1">
        </div>

        <!-- System Prompt -->
        <div class="param-group">
          <div class="param-label">
            <span>系統提示詞 (System Prompt)</span>
          </div>
          <textarea id="input-system-prompt" class="system-prompt-input" placeholder="設定 AI 的角色與行爲...">You are a helpful, intelligent, and precise AI assistant.</textarea>
          <div class="preset-pills" style="flex-wrap: wrap;">
            <button class="preset-pill" onclick="setSystemPreset('code')">💻 程式專家</button>
            <button class="preset-pill" onclick="setSystemPreset('translate')">🌐 多國翻譯員</button>
            <button class="preset-pill" onclick="setSystemPreset('concise')">⚡ 簡潔分析師</button>
          </div>
        </div>
      </aside>

    </main>

    <!-- Remote API Settings Modal -->
    <div id="settings-modal" class="modal-backdrop">
      <div class="modal-card">
        <div class="modal-header">
          <div class="modal-title">
            <span class="icon-slot" data-icon="settings" style="color: var(--primary);"></span>
            <span>API 連線與模型設定</span>
          </div>
          <button id="btn-close-settings" class="icon-btn">
            <span class="icon-slot" data-icon="close"></span>
          </button>
        </div>

        <div style="display: flex; flex-direction: column; gap: 14px;">
          <div class="param-group">
            <label class="param-label">AI 服務提供商</label>
            <select id="settings-provider-select" class="system-prompt-input" style="min-height: 40px;">
              <option value="ollama">Local Ollama (本地 127.0.0.1:11434)</option>
              <option value="openai">OpenAI (GPT-4o / GPT-4o-mini)</option>
              <option value="anthropic">Anthropic (Claude 3.5 / 3.7)</option>
              <option value="deepseek">DeepSeek (V3 / R1 推理模型)</option>
              <option value="custom">Custom OpenAI Compatible (vLLM, LM Studio, OpenRouter)</option>
            </select>
          </div>

          <div class="param-group">
            <label class="param-label">自訂 Base URL (如使用轉接或本地伺服器)</label>
            <input type="text" id="settings-base-url" class="system-prompt-input" style="min-height: 40px;" placeholder="http://127.0.0.1:11434 或 https://api.openai.com">
          </div>

          <div class="param-group">
            <label class="param-label">API Key (遠端 API 專用)</label>
            <input type="password" id="settings-api-key" class="system-prompt-input" style="min-height: 40px;" placeholder="sk-...">
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px;">
          <button id="btn-save-settings" class="new-chat-btn" style="margin: 0; background-color: var(--primary); color: white; border: none;">
            儲存設定
          </button>
        </div>
      </div>
    </div>

    <!-- Container for dynamic Ollama guide modal -->
    <div id="ollama-modal-container"></div>

  </div>

  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
