<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ AI Chatbot - Web Remote UI</title>
  <!-- Google Fonts: Noto Sans TC (思源黑體) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <!-- Marked.js for Markdown & Highlight.js for Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/tokyo-night-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
          </svg>
          <span>AI Chatbot</span>
        </div>
        <button id="btn-new-chat" class="btn-new">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>新對話</span>
        </button>
      </div>

      <div class="session-label">HISTORICAL SESSIONS</div>
      <div id="session-list" class="session-list"></div>

      <div class="sidebar-footer">
        <button id="btn-open-settings" class="btn-settings">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span>設定與微調參數</span>
        </button>
      </div>
    </aside>

    <!-- Main Chat Workspace -->
    <main class="chat-workspace">
      <header class="top-bar">
        <div class="model-selector-bar">
          <label for="quick-model-select">模型 (Model):</label>
          <select id="quick-model-select" class="select-model"></select>
          <button id="btn-refresh-models" class="btn-icon" title="重新整理本地模型">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
          </button>
        </div>
        <div class="header-status" id="header-status">Ollama Connected</div>
      </header>

      <div id="chat-messages" class="messages-container"></div>

      <div class="input-container">
        <textarea id="prompt-input" placeholder="輸入訊息... (Shift+Enter 換行，Enter 發送)" rows="2"></textarea>
        <button id="btn-send" class="btn-send">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
          <span>發送</span>
        </button>
      </div>
    </main>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>⚙️ 設定與 AI 參數微調</h3>
        <button id="btn-close-modal" class="btn-icon">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>AI Provider (後端供應商)</label>
          <select id="setting-provider">
            <option value="ollama">Ollama (Local AI)</option>
            <option value="openai">OpenAI / Custom Cloud API</option>
          </select>
        </div>

        <div class="form-group">
          <label>Ollama Base URL</label>
          <input type="text" id="setting-ollama-url" value="http://localhost:11434">
        </div>

        <div class="form-group">
          <label>OpenAI Base URL</label>
          <input type="text" id="setting-openai-url" value="https://api.openai.com/v1">
        </div>

        <div class="form-group">
          <label>OpenAI API Key</label>
          <input type="password" id="setting-openai-key" placeholder="sk-...">
        </div>

        <hr class="divider">
        <h4>🎛️ AI 生成參數微調</h4>

        <div class="form-group">
          <label>溫度 (Temperature): <span id="val-temp">0.7</span></label>
          <input type="range" id="setting-temp" min="0.0" max="2.0" step="0.1" value="0.7">
          <small>控制創造力：越小越精準平實，越大越有創意。</small>
        </div>

        <div class="form-group">
          <label>上下文視窗長度 (Context Length / Num Ctx)</label>
          <select id="setting-num-ctx">
            <option value="2048">2048 Tokens</option>
            <option value="4096" selected>4096 Tokens (預設)</option>
            <option value="8192">8192 Tokens</option>
            <option value="16384">16384 Tokens</option>
            <option value="32768">32768 Tokens</option>
          </select>
          <small>決定 AI 一次能記住的歷史對話長度。</small>
        </div>

        <div class="form-group">
          <label>重複懲罰 (Repeat Penalty): <span id="val-repeat">1.1</span></label>
          <input type="range" id="setting-repeat" min="0.5" max="2.0" step="0.1" value="1.1">
          <small>數值越高越能減少 AI 產生重複廢話。</small>
        </div>

        <div class="form-group">
          <label>System Prompt (系統提示詞人設)</label>
          <textarea id="setting-system-prompt" rows="3">You are a helpful, concise AI assistant.</textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-save-settings" class="btn-primary">💾 儲存並套用</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
